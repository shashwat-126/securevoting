# ─────────────────────────────────────────────────────────────────
#  Nginx config for SecureVote — place in /etc/nginx/sites-available/securevote
#  Then: sudo ln -s /etc/nginx/sites-available/securevote /etc/nginx/sites-enabled/
#        sudo certbot --nginx -d yourdomain.com
#        sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL (managed by Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers (defense-in-depth alongside Helmet) ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Logging ──
    access_log /var/log/nginx/securevote.access.log;
    error_log  /var/log/nginx/securevote.error.log;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_proxied any;
    gzip_comp_level 6;

    # ── Proxy to Node.js ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Body size limit (protects Node from large payloads)
        client_max_body_size 10k;
    }

    location /health {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Static frontend ──
    location / {
        root   /var/www/securevote/frontend;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets for 1 week
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Block common attack vectors ──
    location ~ /\. { deny all; }
    location ~ \.env { deny all; }
}
